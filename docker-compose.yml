version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-secret-key
      TEMP_DOWNLOAD_DIR: ./temp_downloads
      ALLOW_ORIGINS: http://localhost:3000,https://downloadmedia.site,https://www.downloadmedia.site
      ENVIRONMENT: development
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    depends_on:
      - backend
